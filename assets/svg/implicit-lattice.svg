<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 235" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="cyanSpace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Signed Distance Field Scalar Contour Heatmap Backdrop -->
    <radialGradient id="sdfHeatmapBg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="rgba(6, 182, 212, 0.22)" />
      <stop offset="35%" stop-color="rgba(2, 132, 199, 0.14)" />
      <stop offset="70%" stop-color="rgba(16, 185, 129, 0.08)" />
      <stop offset="100%" stop-color="rgba(6, 10, 21, 0)" />
    </radialGradient>

    <filter id="cyanGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#06b6d4" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Container Base with SDF Contour Heatmap -->
  <rect width="820" height="235" rx="12" fill="#060a16" stroke="#1e293b" stroke-width="1.5"/>
  <rect width="820" height="235" rx="12" fill="url(#sdfHeatmapBg)"/>

  <!-- Left: Formula & Implicit Function -->
  <g transform="translate(30, 25)">
    <rect width="220" height="155" rx="8" fill="#0b1222" stroke="#1e2f4d" stroke-width="1.5"/>
    <rect width="220" height="28" rx="8" fill="#131d35"/>
    <text x="110" y="19" font-family="'DM Mono', monospace" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">ANALYTIC SIGNED DISTANCE</text>

    <text x="20" y="62" font-family="'DM Mono', monospace" font-size="11" font-weight="600" fill="#38bdf8">f(x,y,z) = TPMS(x,y,z) - t</text>
    <text x="20" y="86" font-family="'DM Mono', monospace" font-size="9.5" fill="#94a3b8">Gyroid / Schwarz-D Iso-surface</text>
    <text x="20" y="106" font-family="'DM Mono', monospace" font-size="9.5" fill="#94a3b8">Continuous Functional Grading</text>

    <rect x="15" y="118" width="190" height="26" rx="4" fill="#082f49" stroke="#0284c7"/>
    <text x="110" y="135" font-family="'DM Mono', monospace" font-size="9.5" font-weight="600" fill="#7dd3fc" text-anchor="middle">13.7 KB GLSL Shader Code</text>
  </g>

  <!-- Arrow -->
  <path d="M 260 102 L 290 102" stroke="#06b6d4" stroke-width="2"/>
  <polygon points="288,98 296,102 288,106" fill="#06b6d4"/>

  <!-- Center: GPU Raymarching & Slicing -->
  <g transform="translate(305, 20)" filter="url(#cyanGlow)">
    <rect width="240" height="165" rx="8" fill="#0b1222" stroke="#06b6d4" stroke-width="2"/>
    <rect width="240" height="28" rx="8" fill="url(#cyanSpace)"/>
    <text x="120" y="19" font-family="'DM Mono', monospace" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">GPU COMPUTATION ENGINE</text>

    <rect x="15" y="38" width="210" height="35" rx="4" fill="#121e36" stroke="#1e2f4d"/>
    <text x="120" y="60" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600" fill="#f8fafc" text-anchor="middle">Direct WebGL / GLSL Raymarch</text>

    <rect x="15" y="82" width="210" height="35" rx="4" fill="#121e36" stroke="#1e2f4d"/>
    <text x="120" y="104" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600" fill="#f8fafc" text-anchor="middle">Boundary Conformal Intersection</text>

    <rect x="15" y="126" width="210" height="28" rx="4" fill="#121e36" stroke="#1e2f4d"/>
    <text x="120" y="144" font-family="'DM Mono', monospace" font-size="9.5" fill="#38bdf8" text-anchor="middle">&lt; 0.8 ms Slicing / 4096×4096 Layer</text>
  </g>

  <!-- Arrow -->
  <path d="M 555 102 L 585 102" stroke="#38bdf8" stroke-width="2"/>
  <polygon points="583,98 591,102 583,106" fill="#38bdf8"/>

  <!-- Right: Benchmark Comparison -->
  <g transform="translate(595, 25)">
    <rect width="195" height="155" rx="8" fill="#0b1222" stroke="#1e2f4d" stroke-width="1.5"/>
    <rect width="195" height="28" rx="8" fill="#131d35"/>
    <text x="97" y="19" font-family="'DM Mono', monospace" font-size="11" font-weight="600" fill="#34d399" text-anchor="middle">STORAGE BENCHMARK</text>

    <text x="18" y="58" font-family="'DM Mono', monospace" font-size="9.5" fill="#a5b4fc">Explicit STL: 1.94 GB</text>
    <text x="18" y="78" font-family="'DM Mono', monospace" font-size="9.5" fill="#34d399">Implicit Shader: 13.7 KB</text>

    <rect x="15" y="98" width="165" height="42" rx="4" fill="rgba(16, 185, 129, 0.12)" stroke="rgba(16, 185, 129, 0.35)"/>
    <text x="97" y="115" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" fill="#34d399" text-anchor="middle">&gt; 140,000× Reduction</text>
    <text x="97" y="131" font-family="'DM Mono', monospace" font-size="8.5" fill="#a7f3d0" text-anchor="middle">≥ 52 FPS on Integrated GPU</text>
  </g>

  <!-- Footer metadata -->
  <rect x="0" y="203" width="820" height="32" fill="#040710" stroke="#1e293b" stroke-width="1"/>
  <text x="25" y="223" font-family="'DM Mono', monospace" font-size="10" fill="#94a3b8">BENCHMARK MEASUREMENT · PROCEDURAL TPMS GEOMETRY · NOT AN EXPERIMENTAL METAMATERIAL CLAIM</text>
</svg>
