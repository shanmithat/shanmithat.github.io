  <text x="25" y="228" font-family="'DM Mono', monospace" font-size="10.5" fill="#64748b">VERIFICATION: 2/2 AUTOGRAD TESTS PASS · &lt;3×10⁻⁵ ONNX NUMERICAL PARITY · ZERO-BACKEND WEB DEPLOYMENT</text>
