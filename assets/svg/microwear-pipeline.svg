    <text x="20" y="55" font-family="'DM Mono', monospace" font-size="10" fill="#15803d">• Archard Kinetics: ∂h/∂t = k_w · p(x) · v</text>
    <text x="20" y="77" font-family="'DM Mono', monospace" font-size="10" fill="#0369a1">• Biharmonic Elasticity: ∇⁴Φ = 0</text>
    <text x="20" y="99" font-family="'DM Mono', monospace" font-size="10" fill="#4338ca">• Traction Boundary: σ_yy(x,0) = -p(x)</text>

