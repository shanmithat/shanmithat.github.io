  <!-- Arrow -->
  <path d="M 450 105 L 480 105" stroke="#0284c7" stroke-width="2"/>
  <polygon points="478,101 486,105 478,109" fill="#0284c7"/>

  <!-- Mechanics Constraints & SoftAdapt -->
  <g transform="translate(495, 25)">
    <rect width="295" height="160" rx="8" fill="#f8fafc" stroke="#0284c7" stroke-width="1.5"/>
