<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 260" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="spaceHeader" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="cyanHeader" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <filter id="cosmicGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Container background in deep cosmos -->
  <rect width="820" height="260" rx="12" fill="#080d1a" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Stage 1: Input State -->
  <g transform="translate(30, 35)">
    <rect width="145" height="155" rx="8" fill="#0d1527" stroke="#1e2f4d" stroke-width="1.5"/>
    <rect width="145" height="28" rx="8" fill="#141f36"/>
    <text x="72" y="19" font-family="'DM Mono', monospace" font-size="11" font-weight="600" fill="#38bdf8" text-anchor="middle">INPUT DOMAIN</text>
    
    <!-- Mini grid representation in space -->
    <g transform="translate(32, 44)" stroke="#334155" stroke-width="1" fill="none">
      <rect width="80" height="55" rx="4" stroke="#0ea5e9" stroke-width="1.5" fill="#091122"/>
      <line x1="52" y1="44" x2="52" y2="99" stroke-dasharray="2 2"/>
      <line x1="72" y1="44" x2="72" y2="99" stroke-dasharray="2 2"/>
      <line x1="92" y1="44" x2="92" y2="99" stroke-dasharray="2 2"/>
      <line x1="32" y1="62" x2="112" y2="62" stroke-dasharray="2 2"/>
      <line x1="32" y1="80" x2="112" y2="80" stroke-dasharray="2 2"/>
      <circle cx="72" cy="72" r="14" fill="rgba(56, 189, 248, 0.3)" stroke="#38bdf8" stroke-width="1.5"/>
    </g>

    <text x="72" y="152" font-family="'DM Mono', monospace" font-size="11" fill="#f8fafc" text-anchor="middle">u(x,y,t₀), v_vec</text>
    <text x="72" y="172" font-family="'Inter', sans-serif" font-size="9.5" fill="#94a3b8" text-anchor="middle">32 × 32 Spatial Mesh</text>
  </g>

  <!-- Arrow 1 -->
  <path d="M 185 115 L 220 115" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <polygon points="218,111 226,115 218,119" fill="#38bdf8"/>

  <!-- Stage 2: Fourier Neural Operator Backbone -->
  <g transform="translate(235, 25)" filter="url(#cosmicGlow)">
    <rect width="215" height="175" rx="8" fill="#0d1527" stroke="#0ea5e9" stroke-width="2"/>
    <rect width="215" height="30" rx="8" fill="url(#spaceHeader)"/>
    <text x="107" y="20" font-family="'DM Mono', monospace" font-size="11.5" font-weight="600" fill="#ffffff" text-anchor="middle">2D PI-FNO ARCHITECTURE</text>
    
    <!-- FNO internals -->
    <rect x="15" y="44" width="185" height="30" rx="6" fill="#141f36" stroke="#1e2f4d"/>
    <text x="107" y="63" font-family="'DM Mono', monospace" font-size="10" fill="#38bdf8" text-anchor="middle">Lifting P(u) → Hidden Dim 32</text>

    <rect x="15" y="82" width="185" height="44" rx="6" fill="#112240" stroke="#0ea5e9"/>
    <text x="107" y="100" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="600" fill="#ffffff" text-anchor="middle">4× Spectral Conv (Modes 12)</text>
    <text x="107" y="117" font-family="'DM Mono', monospace" font-size="9.5" fill="#94a3b8" text-anchor="middle">FFT2D → R·F(v) → IFFT2D + W·v</text>

    <rect x="15" y="134" width="185" height="28" rx="6" fill="#141f36" stroke="#1e2f4d"/>
    <text x="107" y="152" font-family="'DM Mono', monospace" font-size="9.5" fill="#cbd5e1" text-anchor="middle">Projection Q → 24 Horizon Steps</text>
  </g>

  <!-- Arrow 2 -->
  <path d="M 460 115 L 495 115" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <polygon points="493,111 501,115 493,119" fill="#38bdf8"/>

  <!-- Stage 3: Predicted Output -->
  <g transform="translate(510, 35)">
    <rect width="135" height="155" rx="8" fill="#0d1527" stroke="#1e2f4d" stroke-width="1.5"/>
    <rect width="135" height="28" rx="8" fill="#141f36"/>
    <text x="67" y="19" font-family="'DM Mono', monospace" font-size="11" font-weight="600" fill="#34d399" text-anchor="middle">PREDICTION</text>
    
    <!-- Evolving plume -->
    <g transform="translate(27, 46)">
      <rect width="80" height="55" rx="4" stroke="#0ea5e9" stroke-width="1.5" fill="#091122"/>
      <ellipse cx="48" cy="27" rx="24" ry="14" fill="rgba(6, 182, 212, 0.35)" transform="rotate(-15 48 27)"/>
      <ellipse cx="56" cy="24" rx="12" ry="7" fill="rgba(56, 189, 248, 0.75)" transform="rotate(-15 56 24)"/>
    </g>

    <text x="67" y="152" font-family="'DM Mono', monospace" font-size="10.5" fill="#38bdf8" text-anchor="middle">u_pred(x,y,t₁..₂₄)</text>
    <text x="67" y="172" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">120-min Horizon</text>
  </g>

  <!-- Residual Loop back to training -->
  <g transform="translate(655, 45)">
    <!-- Branch to PDE residual -->
    <path d="M 0 70 C 40 70, 40 -12, -290 -12 C -440 -12, -440 25, -295 25" 
          stroke="#fbbf24" stroke-width="1.75" stroke-dasharray="4 3" fill="none"/>
    <polygon points="-295,22 -287,25 -295,28" fill="#fbbf24"/>

    <rect x="25" y="25" width="130" height="82" rx="6" fill="rgba(245, 158, 11, 0.12)" stroke="rgba(245, 158, 11, 0.4)" stroke-width="1.5"/>
    <text x="90" y="46" font-family="'DM Mono', monospace" font-size="9.5" font-weight="600" fill="#fbbf24" text-anchor="middle">PDE RESIDUAL LOSS</text>
    <text x="90" y="64" font-family="'DM Mono', monospace" font-size="9" fill="#fde68a" text-anchor="middle">∂u/∂t + v·∇u - D∇²u</text>
    <text x="90" y="82" font-family="'Inter', sans-serif" font-size="8.5" fill="#fbbf24" text-anchor="middle">39.5% Residual Drop</text>
    <text x="90" y="96" font-family="'Inter', sans-serif" font-size="8" fill="#94a3b8" text-anchor="middle">Finite-Diff Regularizer</text>
  </g>

  <!-- Footer metadata bar -->
  <rect x="0" y="228" width="820" height="32" fill="#050812" stroke="#1e293b" stroke-width="1"/>
  <text x="30" y="249" font-family="'DM Mono', monospace" font-size="10.5" fill="#94a3b8">ARCHITECTURE: 106,264 PARAMETERS · FIXED-SEED EVALUATION · NO HEURISTIC SPEED CLAIMS</text>
</svg>
