<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 365" width="100%" height="100%" fill="none">
  <defs>
    <!-- Scientific Heatmap Gradient: Pure Purple -> Blue -> Green Colormap -->
    <linearGradient id="heatmapColormap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="25%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="75%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Atmospheric transport background mesh in purple-blue-green -->
    <radialGradient id="transportPlumeBg" cx="45%" cy="35%" r="60%">
      <stop offset="0%" stop-color="rgba(37, 99, 235, 0.18)" />
      <stop offset="45%" stop-color="rgba(139, 92, 246, 0.12)" />
      <stop offset="85%" stop-color="rgba(16, 185, 129, 0.08)" />
      <stop offset="100%" stop-color="rgba(3, 5, 13, 0)" />
    </radialGradient>

    <linearGradient id="fnoHeader" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="pdeHeader" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6d28d9" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#3b82f6" flood-opacity="0.28"/>
    </filter>

    <filter id="purpleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#8b5cf6" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Container Base with Purple-Blue-Green Heatmap Backdrop -->
  <rect width="940" height="365" rx="14" fill="#040612" stroke="#1e293b" stroke-width="1.5"/>
  <rect width="940" height="365" rx="14" fill="url(#transportPlumeBg)"/>

  <!-- Advection-diffusion streamlines in background (blue & purple) -->
  <g opacity="0.22" stroke="#3b82f6" stroke-width="1" fill="none">
    <path d="M 20 70 C 140 60, 260 90, 420 80 C 580 70, 720 100, 920 85" stroke-dasharray="3 3"/>
    <path d="M 20 140 C 180 120, 320 165, 520 145 C 680 130, 800 170, 920 150" stroke-dasharray="4 4"/>
    <path d="M 20 210 C 160 220, 340 190, 560 215 C 720 230, 820 200, 920 210" stroke-dasharray="3 3"/>
  </g>

  <!-- TOP HEADER & SCIENTIFIC COLORMAP BAR -->
  <g transform="translate(25, 16)">
    <text x="0" y="18" font-family="'DM Mono', monospace" font-size="12" font-weight="600" fill="#60a5fa" letter-spacing="0.06em">
      AETHERCAST · 2D PHYSICS-INFORMED FOURIER NEURAL OPERATOR PIPELINE
    </text>
    
    <!-- Heatmap legend bar (Purple-Blue-Green ALONE) -->
    <g transform="translate(620, 4)">
      <text x="-8" y="11" font-family="'DM Mono', monospace" font-size="9" fill="#94a3b8" text-anchor="end">Tracer Plume u(x,t): 0.0</text>
      <rect x="0" y="2" width="130" height="10" rx="3" fill="url(#heatmapColormap)" stroke="#334155" stroke-width="0.8"/>
      <text x="138" y="11" font-family="'DM Mono', monospace" font-size="9" fill="#34d399">1.0 Max</text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- STAGE 01: INPUT STATE -->
  <!-- ================================================================= -->
  <g transform="translate(25, 48)">
    <rect width="180" height="195" rx="8" fill="#090e1d" stroke="#1e2f4d" stroke-width="1.5"/>
    <rect width="180" height="28" rx="8" fill="#111a33"/>
    <text x="90" y="18" font-family="'DM Mono', monospace" font-size="10.5" font-weight="600" fill="#60a5fa" text-anchor="middle">
      STAGE 01 : INPUT DOMAIN
    </text>

    <!-- Mini Spatial Mesh with Initial Gaussian Heatmap Plume (Purple-Blue-Green) -->
    <g transform="translate(25, 40)">
      <rect width="130" height="85" rx="4" fill="#060b17" stroke="#1e293b" stroke-width="1"/>
      
      <!-- Coordinate grid -->
      <line x1="43" y1="0" x2="43" y2="85" stroke="#131e36" stroke-width="1" stroke-dasharray="2 2"/>
      <line x1="86" y1="0" x2="86" y2="85" stroke="#131e36" stroke-width="1" stroke-dasharray="2 2"/>
      <line x1="0" y1="28" x2="130" y2="28" stroke="#131e36" stroke-width="1" stroke-dasharray="2 2"/>
      <line x1="0" y1="56" x2="130" y2="56" stroke="#131e36" stroke-width="1" stroke-dasharray="2 2"/>
      
      <!-- Heatmap Plume Initial State: Purple -> Blue -> Emerald -->
      <circle cx="50" cy="42" r="28" fill="rgba(124, 58, 237, 0.25)"/>
      <circle cx="50" cy="42" r="18" fill="rgba(37, 99, 235, 0.45)"/>
      <circle cx="50" cy="42" r="10" fill="rgba(16, 185, 129, 0.65)"/>
      <circle cx="50" cy="42" r="4" fill="#34d399"/>

      <!-- Velocity field arrows -->
      <g stroke="#60a5fa" stroke-width="1.2" opacity="0.85">
        <line x1="85" y1="30" x2="105" y2="26"/>
        <polygon points="105,24 110,26 105,28" fill="#60a5fa"/>
        <line x1="85" y1="54" x2="108" y2="50"/>
        <polygon points="108,48 113,50 108,52" fill="#60a5fa"/>
      </g>
    </g>

    <text x="90" y="148" font-family="'DM Mono', monospace" font-size="10.5" font-weight="600" fill="#f8fafc" text-anchor="middle">
      u(x, y, t₀) &amp; v_vec(x, y)
    </text>
    <text x="90" y="165" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">
      32 × 32 Mesh (1024 Nodes)
    </text>
    <text x="90" y="180" font-family="'Inter', sans-serif" font-size="8.5" fill="#38bdf8" text-anchor="middle">
      Initial Scalar &amp; Advection Field
    </text>
  </g>

  <!-- Forward Connector: Stage 1 -> Stage 2 -->
  <g stroke="#3b82f6" stroke-width="1.75">
    <line x1="205" y1="145" x2="238" y2="145"/>
    <polygon points="236,141 244,145 236,149" fill="#3b82f6"/>
  </g>

  <!-- ================================================================= -->
  <!-- STAGE 02: 2D FOURIER NEURAL OPERATOR BACKBONE -->
  <!-- ================================================================= -->
  <g transform="translate(245, 48)" filter="url(#subtleGlow)">
    <rect width="250" height="195" rx="8" fill="#090e1d" stroke="#2563eb" stroke-width="2"/>
    <rect width="250" height="28" rx="8" fill="url(#fnoHeader)"/>
    <text x="125" y="18" font-family="'DM Mono', monospace" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">
      STAGE 02 : 2D PI-FNO BACKBONE
    </text>

    <!-- Sub-block 1: Lifting -->
    <rect x="15" y="38" width="220" height="26" rx="5" fill="#101933" stroke="#1e2f4d"/>
    <text x="125" y="55" font-family="'DM Mono', monospace" font-size="9.5" font-weight="500" fill="#93c5fd" text-anchor="middle">
      Lifting Layer P : R² → R³²
    </text>

    <!-- Sub-block 2: Spectral Convolutions -->
    <rect x="15" y="72" width="220" height="74" rx="6" fill="#0d162e" stroke="#1d4ed8" stroke-width="1.2"/>
    <text x="125" y="90" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">
      4× Fourier Spectral Layers
    </text>
    <text x="125" y="107" font-family="'DM Mono', monospace" font-size="9" fill="#94a3b8" text-anchor="middle">
      FFT2D → R_ϕ · F(v) → IFFT2D
    </text>
    <text x="125" y="123" font-family="'DM Mono', monospace" font-size="8.5" fill="#60a5fa" text-anchor="middle">
      Truncated Fourier Modes: k_max = 12
    </text>
    <text x="125" y="137" font-family="'DM Mono', monospace" font-size="8.5" fill="#c4b5fd" text-anchor="middle">
      Residual Bypass W·v + GELU(·)
    </text>

    <!-- Sub-block 3: Projection -->
    <rect x="15" y="154" width="220" height="28" rx="5" fill="#101933" stroke="#1e2f4d"/>
    <text x="125" y="172" font-family="'DM Mono', monospace" font-size="9.5" font-weight="500" fill="#f8fafc" text-anchor="middle">
      Projection Q : R³² → R²⁴ (Rollout)
    </text>
  </g>

  <!-- Forward Connector: Stage 2 -> Stage 3 -->
  <g stroke="#3b82f6" stroke-width="1.75">
    <line x1="495" y1="145" x2="528" y2="145"/>
    <polygon points="526,141 534,145 526,149" fill="#3b82f6"/>
  </g>

  <!-- ================================================================= -->
  <!-- STAGE 03: PREDICTED ROLLOUT STATE -->
  <!-- ================================================================= -->
  <g transform="translate(535, 48)">
    <rect width="180" height="195" rx="8" fill="#090e1d" stroke="#1e2f4d" stroke-width="1.5"/>
    <rect width="180" height="28" rx="8" fill="#111a33"/>
    <text x="90" y="18" font-family="'DM Mono', monospace" font-size="10.5" font-weight="600" fill="#34d399" text-anchor="middle">
      STAGE 03 : PREDICTION
    </text>

    <!-- Mini Spatial Mesh with Downstream Dispersed Plume (Purple-Blue-Green) -->
    <g transform="translate(25, 40)">
      <rect width="130" height="85" rx="4" fill="#060b17" stroke="#1e293b" stroke-width="1"/>
      
      <!-- Coordinate grid -->
      <line x1="43" y1="0" x2="43" y2="85" stroke="#131e36" stroke-width="1" stroke-dasharray="2 2"/>
      <line x1="86" y1="0" x2="86" y2="85" stroke="#131e36" stroke-width="1" stroke-dasharray="2 2"/>
      <line x1="0" y1="28" x2="130" y2="28" stroke="#131e36" stroke-width="1" stroke-dasharray="2 2"/>
      <line x1="0" y1="56" x2="130" y2="56" stroke="#131e36" stroke-width="1" stroke-dasharray="2 2"/>
      
      <!-- Dispersed downstream plume in purple, blue, and emerald -->
      <ellipse cx="78" cy="46" rx="38" ry="24" fill="rgba(124, 58, 237, 0.25)" transform="rotate(-12 78 46)"/>
      <ellipse cx="84" cy="44" rx="24" ry="14" fill="rgba(37, 99, 235, 0.40)" transform="rotate(-12 84 44)"/>
      <ellipse cx="88" cy="42" rx="14" ry="8" fill="rgba(16, 185, 129, 0.65)" transform="rotate(-12 88 42)"/>
      <circle cx="91" cy="41" r="4" fill="#34d399"/>
    </g>

    <text x="90" y="148" font-family="'DM Mono', monospace" font-size="10.5" font-weight="600" fill="#93c5fd" text-anchor="middle">
      u_pred(x, y, t₁ .. t₂₄)
    </text>
    <text x="90" y="165" font-family="'Inter', sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">
      120-Minute Trajectory
    </text>
    <text x="90" y="180" font-family="'Inter', sans-serif" font-size="8.5" fill="#34d399" text-anchor="middle">
      Advected Plume Concentration
    </text>
  </g>

  <!-- Forward Connector: Stage 3 -> Stage 4 -->
  <g stroke="#3b82f6" stroke-width="1.75">
    <line x1="715" y1="145" x2="740" y2="145"/>
    <polygon points="738,141 746,145 738,149" fill="#3b82f6"/>
  </g>

  <!-- ================================================================= -->
  <!-- STAGE 04: PHYSICS PDE RESIDUAL REGULARIZATION (PURPLE-VIOLET THEMED) -->
  <!-- ================================================================= -->
  <g transform="translate(747, 48)" filter="url(#purpleGlow)">
    <rect width="168" height="195" rx="8" fill="#090e1d" stroke="rgba(139, 92, 246, 0.6)" stroke-width="1.5"/>
    <rect width="168" height="28" rx="8" fill="url(#pdeHeader)"/>
    <text x="84" y="18" font-family="'DM Mono', monospace" font-size="10.5" font-weight="700" fill="#ffffff" text-anchor="middle">
      STAGE 04 : PDE RESIDUAL
    </text>

    <!-- Residual Equation -->
    <rect x="10" y="38" width="148" height="34" rx="5" fill="#13112a" stroke="rgba(139, 92, 246, 0.35)"/>
    <text x="84" y="54" font-family="'DM Mono', monospace" font-size="9" font-weight="600" fill="#c4b5fd" text-anchor="middle">
      R(u) = ∂u/∂t + v·∇u - D∇²u
    </text>
    <text x="84" y="66" font-family="'Inter', sans-serif" font-size="7.8" fill="#94a3b8" text-anchor="middle">
      Advection-Diffusion Transport
    </text>

    <rect x="10" y="80" width="148" height="48" rx="5" fill="#13112a" stroke="#1e293b"/>
    <text x="84" y="96" font-family="'DM Mono', monospace" font-size="9" font-weight="600" fill="#ddd6fe" text-anchor="middle">
      L_phy = || R(u_pred) ||²
    </text>
    <text x="84" y="110" font-family="'Inter', sans-serif" font-size="8" fill="#94a3b8" text-anchor="middle">
      Finite-Difference Stencil
    </text>
    <text x="84" y="121" font-family="'Inter', sans-serif" font-size="8" fill="#a78bfa" text-anchor="middle">
      λ_phy = 0.01 Weighting
    </text>

    <rect x="10" y="136" width="148" height="46" rx="5" fill="rgba(139, 92, 246, 0.14)" stroke="rgba(139, 92, 246, 0.4)"/>
    <text x="84" y="153" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="700" fill="#c4b5fd" text-anchor="middle">
      39.5% Residual Drop
    </text>
    <text x="84" y="169" font-family="'DM Mono', monospace" font-size="8.2" fill="#34d399" text-anchor="middle">
      vs Data-Only FNO (1k traj)
    </text>
  </g>

  <!-- ================================================================= -->
  <!-- DEDICATED LOWER FEEDBACK BUS RAIL (PURPLE-VIOLET, ZERO OVERLAP) -->
  <!-- ================================================================= -->
  <!-- Drops down from Stage 4 bottom (y=243), travels across at y=285, enters Stage 2 from below -->
  <g>
    <!-- Path: (831, 243) -> (831, 285) -> (370, 285) -> (370, 245) -->
    <path d="M 831 243 L 831 285 L 370 285 L 370 247" 
          stroke="#8b5cf6" stroke-width="2" stroke-dasharray="6 4" fill="none"/>
    <!-- Upward arrow entering Stage 2 backbone -->
    <polygon points="366,248 370,242 374,248" fill="#8b5cf6"/>

    <!-- Clear callout badge centered along the feedback rail -->
    <g transform="translate(470, 271)">
      <rect width="250" height="26" rx="13" fill="#0d112b" stroke="#8b5cf6" stroke-width="1.2"/>
      <circle cx="14" cy="13" r="4" fill="#8b5cf6"/>
      <text x="132" y="17" font-family="'DM Mono', monospace" font-size="9" font-weight="600" fill="#c4b5fd" text-anchor="middle">
        Backpropagate Physics Loss ∇_θ L_total
      </text>
    </g>
  </g>

  <!-- ================================================================= -->
  <!-- BOTTOM METADATA STATUS BAR -->
  <!-- ================================================================= -->
  <g transform="translate(0, 325)">
    <rect width="940" height="40" rx="0" fill="#020409" stroke="#1e293b" stroke-width="1"/>
    <text x="25" y="24" font-family="'DM Mono', monospace" font-size="9.5" fill="#64748b">
      TOTAL PARAMETERS: 106,264 · 3 SEED EVALUATION (42, 123, 999) · CPU/GPU LATENCY BENCHMARKED · SCIENTIFIC PROTOTYPE
    </text>
    <text x="915" y="24" font-family="'DM Mono', monospace" font-size="9.5" font-weight="600" fill="#34d399" text-anchor="end">
      DOUBLE-BLIND REVIEW · NEURIPS 2026 AI4SCIENCE
    </text>
  </g>
</svg>
