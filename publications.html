<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ENV_03 // The Archive — SHANMITHA T.</title>
  <meta name="description" content="The Archive: published research, workshop submissions, technical notes, and reproducible experiments by Shanmitha T.">
  <link rel="stylesheet" href="css/system.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%23050606'/><rect x='2' y='2' width='28' height='28' fill='none' stroke='%23C5C9CE' stroke-width='2'/><rect x='11' y='11' width='10' height='10' fill='%23C5C9CE'/></svg>">
</head>
<body class="tex-scanlines tex-noise tex-wireframe">
  <div id="navMount"></div>

  <main class="shell-wrap" data-tone="silver">
    <section class="band">
      <div class="band-head">
        <div>
          <span class="env-code">ENV_03 // THE ARCHIVE</span>
          <h1 class="env-title">RESEARCH &amp; TECHNICAL ARCHIVE</h1>
        </div>
        <a href="https://scholar.google.com/citations?user=W8r_xnEAAAAJ&hl=en" target="_blank" rel="noopener noreferrer" class="cmd-btn">GOOGLE SCHOLAR ↗</a>
      </div>

      <div id="divPub"></div>
      <div id="pubPublished" style="display:flex;flex-direction:column;gap:1.15rem;"></div>

      <div id="divSub"></div>
      <div id="pubSubmissions" style="display:flex;flex-direction:column;gap:1.15rem;"></div>

      <div id="divNotes"></div>
      <div class="grid-12" id="notesList"></div>
    </section>
  </main>

  <div id="footerMount"></div>

  <script type="module">
    import { initShell } from './js/app.js';
    import { InstrumentIndex, ResearchRecord, SignalDivider, TransmissionFooter } from './js/components/ui.js';
    import { PUBLICATIONS, TECHNICAL_NOTES } from './js/data/publications.js';

    document.getElementById('navMount').innerHTML = InstrumentIndex({ activeEnv: '03', coordLabel: 'THE_ARCHIVE', ledTone: 'var(--silver)' });
    document.getElementById('footerMount').innerHTML = TransmissionFooter();
    initShell();

    document.getElementById('divPub').innerHTML = SignalDivider('03.1 // PUBLISHED RESEARCH');
    document.getElementById('divSub').innerHTML = SignalDivider('03.2 // SUBMISSIONS & UNDER REVIEW');
    document.getElementById('divNotes').innerHTML = SignalDivider('03.3 // TECHNICAL NOTES & EXPERIMENTS');

    const published = PUBLICATIONS.filter((p) => p.status.includes('PUBLISHED'));
    const subs = PUBLICATIONS.filter((p) => !p.status.includes('PUBLISHED'));

    document.getElementById('pubPublished').innerHTML = published.map((p, i) => ResearchRecord(p, i)).join('');
    document.getElementById('pubSubmissions').innerHTML = subs.map((p, i) => ResearchRecord(p, i)).join('');

    document.querySelectorAll('.bib-btn').forEach((btn) => {
      btn.addEventListener('click', () => {
        const pre = document.getElementById(btn.dataset.target);
        const open = pre.style.display === 'block';
        pre.style.display = open ? 'none' : 'block';
        btn.textContent = open ? 'BIBTEX [+]' : 'BIBTEX [−]';
      });
    });

    document.getElementById('notesList').innerHTML = TECHNICAL_NOTES.map((n) => `
      <a href="${n.url}" class="frame col-4" style="padding:1.15rem;display:block;">
        <div style="font-family:var(--font-mono);font-size:0.68rem;color:var(--phosphor);margin-bottom:0.35rem;">${n.code}</div>
        <div style="font-family:var(--font-display);font-size:1.3rem;color:var(--silver-bright);margin-bottom:0.35rem;">${n.title}</div>
        <div style="font-family:var(--font-mono);font-size:0.72rem;color:var(--graphite-light);">${n.meta}</div>
      </a>
    `).join('');
  </script>
</body>
</html>
